name: rail_inspect
description: Offline-first station inspection app for railway commercial inspectors and officers.
publish_to: "none"
version: 0.7.0+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  image_picker: 1.1.2
  intl: ^0.19.0
  path: ^1.9.0
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/offline_station_pack.json
    - assets/stations/station_heritage_hero.png
